name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish crates, Docker images, and GitHub release assets"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRATE_PACKAGES: >-
        shardline-protocol
        shardline-xet-core
        shardline-metrics
        shardline-auth
        shardline-validation
        shardline-test-support
        shardline-storage
        shardline-cache
        shardline-vcs
        shardline-index
        shardline-cas
        shardline-server-core
        shardline-oci-adapter
        shardline-protocol-adapters
        shardline-xet-adapter
        shardline-provider-events
        shardline-hub-api
        shardline-fsck
        shardline-gc
        shardline-rebuild
        shardline-server
        shardline-bench
        shardline
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "FETCH_HEAD"; then
            echo "Tag ${GITHUB_REF_NAME} points to commit ${GITHUB_SHA} which is not on origin/main"
            exit 1
          fi

      - name: Validate publish ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual publish must be run from a release tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Validate release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid -p shardline | sed -E 's/.*#([^#]+)$/\1/')"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

      - name: Run contributor CI matrix
        run: cargo make ci

      - name: Run release-candidate infrastructure matrix
        run: cargo make test-infrastructure

      - name: Build release archive
        run: bash scripts/build-release-archive.sh x86_64-unknown-linux-gnu dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Docker image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: shardline:release-check

      - name: Smoke-test Docker image
        run: docker run --rm shardline:release-check --help >/dev/null

      - name: Derive GHCR image name
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        id: ghcr
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shardline" >> "${GITHUB_OUTPUT}"

      - name: Publish crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish crates" >&2
            exit 1
          fi

          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#([^#]+)$/\1/'
          }

          crate_version_published() {
            local crate="$1"
            local version="$2"
            curl --fail --silent --show-error --retry 3 --retry-delay 3 \
              -H "User-Agent: shardline-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" \
              >/dev/null 2>&1
          }

          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            if crate_version_published "${crate}" "${version}"; then
              echo "${crate} ${version} already exists on crates.io; skipping"
              continue
            fi
            if ! cargo publish --locked -p "${crate}"; then
              # A concurrent, restartable release may have completed this exact
              # publish between the preflight check and cargo publish. Only
              # tolerate that verified outcome; every other failure aborts.
              if crate_version_published "${crate}" "${version}"; then
                echo "${crate} ${version} was published concurrently; continuing"
                continue
              fi
              echo "Failed to publish ${crate} ${version}" >&2
              exit 1
            fi
            echo "${crate} ${version} published successfully"
            sleep 15
          done

      - name: Verify published crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#([^#]+)$/\1/'
          }
          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            # crates.io API requires a User-Agent; retry on 403/rate-limit
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              -H "User-Agent: shardline-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
            sleep 2
          done

      - name: Login to GHCR
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.ghcr.outputs.image }}:${{ github.ref_name }}

      - name: Attest release archive provenance
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub release assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Promote verified image to latest
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.ghcr.outputs.image }}:latest" \
            "${{ steps.ghcr.outputs.image }}:${{ github.ref_name }}"
