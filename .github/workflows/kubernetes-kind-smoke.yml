name: Kubernetes Deployment Smoke

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "e2e/**"
      - "docs/k8s/**"
      - "tests/k8s/**"
      - "scripts/docker-entrypoint.sh"
      - "scripts/k8s/**"
      - ".github/workflows/kubernetes-kind-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-kind-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Install kind
        run: |
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64 \
            --output /usr/local/bin/kind
          chmod +x /usr/local/bin/kind
          kind version

      - name: Run disposable Kubernetes deployment smoke test
        env:
          SHARDLINE_KIND_LOG_DIR: ${{ runner.temp }}/shardline-kind-smoke-logs
        run: scripts/k8s/kind-smoke.sh

      - name: Upload kind diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-smoke-diagnostics
          path: ${{ runner.temp }}/shardline-kind-smoke-logs
          if-no-files-found: ignore
