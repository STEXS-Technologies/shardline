name: Reliability soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Deterministic chaos campaign duration
        required: false
        default: "7200"
  schedule:
    - cron: "31 1 * * 0"

permissions:
  contents: read

concurrency:
  group: reliability-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Run replayable chaos soak
        env:
          SHARDLINE_SOAK_DURATION_SECONDS: ${{ inputs.duration_seconds || '7200' }}
          SHARDLINE_SOAK_INITIAL_SEED: "2436552524"
        run: scripts/reliability-soak.sh reliability-soak-results

      - name: Publish soak summary
        if: always()
        run: |
          if [ -f reliability-soak-results/summary.md ]; then
            cat reliability-soak-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shardline-reliability-soak-${{ github.sha }}
          path: reliability-soak-results
          if-no-files-found: error
          retention-days: 90
