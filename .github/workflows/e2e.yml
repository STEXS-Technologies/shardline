name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - improve/reliability-integration-upgrade
      - improve/protocol-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shardline-e2e-only
          POSTGRES_DB: shardline_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shardline_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHARDLINE_REQUIRE_NATIVE_CLIENTS: "1"
      DATABASE_URL: postgres://postgres:shardline-e2e-only@127.0.0.1:5432/shardline_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Build shardline binary
        run: cargo build --locked --release

      - name: Apply disposable PostgreSQL schema as owner
        run: target/release/shardline db migrate up --database-url "$DATABASE_URL"

      - name: Qualify Hub PostgreSQL HTTP contracts in fresh databases
        run: SHARDLINE_BIN=target/release/shardline bash scripts/test-hub-postgres.sh

      - name: Install real clients
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/mc \
            https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  /usr/local/bin/mc" \
            | sha256sum --check --strict
          sudo chmod +x /usr/local/bin/mc
          mc --version
          git_lfs_archive="${RUNNER_TEMP}/git-lfs-linux-amd64-v3.7.1.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${git_lfs_archive}" \
            https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
          echo "1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08  ${git_lfs_archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${git_lfs_archive}" --directory "${RUNNER_TEMP}"
          sudo install --mode=0755 "${RUNNER_TEMP}/git-lfs-3.7.1/git-lfs" /usr/local/bin/git-lfs
          git-lfs version
          sudo curl --fail --location --silent --show-error \
            --output /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /usr/local/bin/bazelisk" \
            | sha256sum --check --strict
          sudo chmod 0755 /usr/local/bin/bazelisk
          USE_BAZEL_VERSION=8.7.0 bazelisk version
          pip3 install --break-system-packages huggingface_hub hf_xet httpx pyarrow duckdb awscli boto3 s3cmd
          python3 -c "import huggingface_hub, hf_xet, httpx"
          hf_python="$(sed -n '1s/^#!//p' "$(command -v hf)")"
          test -x "$hf_python"
          "$hf_python" -m pip install httpx
          "$hf_python" -c "import huggingface_hub, hf_xet, httpx"
          hf --version
          python3 -c "import pyarrow; print('pyarrow', pyarrow.__version__)"
          python3 -c "import duckdb; print('duckdb', duckdb.__version__)"
          aws --version
          python3 -c "import boto3; print('boto3', boto3.__version__)"
          s3cmd --version
          sudo apt-get update
          sudo apt-get install -y rclone skopeo podman unzip
          rclone --version
          skopeo --version
          podman info
          docker info
          helm_archive="${RUNNER_TEMP}/helm-v3.19.0-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${helm_archive}" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  ${helm_archive}" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/helm-client"
          tar --extract --gzip --file "${helm_archive}" --directory "${RUNNER_TEMP}/helm-client"
          sudo install --mode=0755 "${RUNNER_TEMP}/helm-client/linux-amd64/helm" /usr/local/bin/helm
          helm version --short
          git_xet_archive="${RUNNER_TEMP}/git-xet-linux-x86_64-v0.2.1.zip"
          curl --fail --location --silent --show-error \
            --output "${git_xet_archive}" \
            https://github.com/huggingface/xet-core/releases/download/git-xet-v0.2.1/git-xet-linux-x86_64.zip
          echo "e6354d55704cc838d1feed79ee27b9b89da7752ae98bd83df5797c180700fdb1  ${git_xet_archive}" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/git-xet-client"
          unzip -q "${git_xet_archive}" -d "${RUNNER_TEMP}/git-xet-client"
          sudo install --mode=0755 "${RUNNER_TEMP}/git-xet-client/git-xet" /usr/local/bin/git-xet
          git-xet --version

      - name: Qualify Git LFS locking and OCI Distribution v1.1.1
        run: bash scripts/verify-protocol-conformance.sh

      - name: Run e2e tests
        env:
          USE_BAZEL_VERSION: "8.7.0"
        run: cargo make test-e2e

      - name: Qualify repository creation races across PostgreSQL replicas
        run: >-
          cargo nextest run --locked --manifest-path e2e/Cargo.toml
          --test hub_api_e2e --run-ignored only
          -E 'test(postgres_repository_creation_preserves_winner_visibility_across_replicas)'

      - name: Qualify native Xet with PostgreSQL and MinIO
        run: bash scripts/shardline/verify_maintenance_native_xet.sh

      - name: Qualify native Hugging Face Hub with PostgreSQL and MinIO
        run: >-
          cargo nextest run --locked --manifest-path e2e/Cargo.toml
          --test native_huggingface_cli_e2e --run-ignored all
          -E 'test(native_huggingface_cli_flows_with_postgres_and_minio)'

      - name: Qualify stock git-xet through the real Hub with PostgreSQL and MinIO
        run: >-
          cargo nextest run --locked --manifest-path e2e/Cargo.toml
          --test git_xet_push_e2e --run-ignored all
          -E 'test(stock_git_xet_real_hub_with_postgres_and_minio)'

      - name: Qualify native Xet FSCK with PostgreSQL and MinIO
        run: >-
          cargo nextest run --locked -p shardline --test fsck_cli
          --run-ignored all -E 'test(native_xet_fsck_with_postgres_and_minio)'

      - name: Qualify HTTP disconnect during remote Xet verification and downloads
        run: >-
          cargo nextest run --locked -p shardline-server --features docker --lib
          --run-ignored all
          -E 'test(disconnect_during_remote_shard_verification_prevents_publication_and_allows_retry) | test(disconnected_remote_native_download_stops_before_next_source_and_retries_verified)'

      - name: Qualify native shard source reuse and corruption rejection
        run: >-
          cargo nextest run --locked -p shardline-server --features docker
          --test native_shard_reads --run-ignored only
          -E 'test(native_shard_preparation_reuses_each_verified_provider_source)'

      - name: Qualify native member recovery without standalone copies
        run: >-
          cargo nextest run --locked -p shardline-server --features docker --lib
          --run-ignored only
          -E 'test(native_members_survive_replica_restart_without_standalone_copies)'

      - name: Qualify Xet deduplication and delta reads during deletion and restart
        run: >-
          cargo nextest run --locked --manifest-path e2e/Cargo.toml
          --test transfer_http --run-ignored only
          -E 'test(native_dedup_delete_fencing_survives_replica_restart) or test(native_delta_delete_fencing_survives_replica_restart)'

      - name: Qualify large native Xet transfers and process recovery
        run: |
          client_env="${RUNNER_TEMP}/native-xet-qualification"
          python3 -m venv "$client_env"
          "$client_env/bin/pip" install huggingface_hub==1.25.1 hf_xet==1.6.0
          export PATH="$client_env/bin:$PATH"
          cargo nextest run --locked -p shardline-server --features docker \
            --test native_upload_process --run-ignored all \
            -E 'test(stock_xet_large_upload_recovers) or test(native_xorb_remote_sigkill_at_every_durable_boundary) or test(native_xorb_remote_alternate_encoding_round_trip) or test(native_xorb_retry_survives_sigkill_at_every_durable_boundary)'
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(native_huggingface_one_gib) or test(native_huggingface_cli_recovers_after_expired_xorb_url) or test(native_sdx_reads_expired_xorb_url) or test(native_huggingface_permissive_whoami_preserves_anonymous_identity)'

      - name: Qualify official JavaScript native delta edits
        run: |
          node --version
          client_root="$RUNNER_TEMP/hf-js-2171"
          npm install --prefix "$client_root" --no-audit --no-fund @huggingface/hub@2.17.1
          SHARDLINE_HF_JS_ROOT="$client_root" cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(official_huggingface_js_edits_use_native_delta)'

      - name: Qualify hf_xet 1.5 expiry recovery
        run: |
          client_env="${RUNNER_TEMP}/native-xet-15-qualification"
          python3 -m venv "$client_env"
          "$client_env/bin/pip" install huggingface_hub==1.25.1 hf_xet==1.5.2
          export PATH="$client_env/bin:$PATH"
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(native_huggingface_cli_recovers_after_expired_xorb_url)'

      - name: Qualify hf_xet 1.7 client compatibility
        run: |
          client_env="${RUNNER_TEMP}/native-xet-17-qualification"
          python3 -m venv "$client_env"
          "$client_env/bin/pip" install huggingface_hub==1.25.1 hf_xet==1.7.0
          export PATH="$client_env/bin:$PATH"
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(native_huggingface_cli_model_and_dataset_flows_work_against_shardline) or test(native_huggingface_cli_flows_with_postgres_and_minio) or test(native_huggingface_cli_flows_with_postgres_and_local_objects) or test(native_huggingface_cli_recovers_after_expired_xorb_url)'
          cargo nextest run --locked -p shardline-server --features docker \
            --test native_upload_process --run-ignored all \
            -E 'test(stock_xet_large_upload_recovers)'
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(native_huggingface_one_gib)'

      - name: Qualify Hugging Face Hub 2.2 client compatibility
        run: |
          client_env="${RUNNER_TEMP}/native-hub-22-qualification"
          python3 -m venv "$client_env"
          "$client_env/bin/pip" install huggingface_hub==2.2.0 hf_xet==1.7.0 httpx==0.28.1 duckdb==1.5.5 pyarrow==25.0.0
          export PATH="$client_env/bin:$PATH"
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all \
            -E 'test(native_huggingface_cli_model_and_dataset_flows_work_against_shardline) or test(native_huggingface_cli_flows_with_postgres_and_minio) or test(native_huggingface_cli_recovers_after_expired_xorb_url)'
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_huggingface_cli_e2e --run-ignored all --test-threads 1 \
            -E 'test(native_huggingface_http_analytics::)'

      - name: Run native Bazel client flows
        env:
          USE_BAZEL_VERSION: "8.7.0"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo nextest run --locked --manifest-path e2e/Cargo.toml \
              --test native_protocol_frontends_e2e \
              -E 'test(native_bazel)' --run-ignored all; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Native Bazel E2E attempt ${attempt} failed; retrying for transient client dependency failures."
              sleep 10
            fi
          done
          exit 1

      - name: Run adjacent client compatibility
        run: |
          set -euo pipefail
          git_lfs_archive="${RUNNER_TEMP}/git-lfs-linux-amd64-v3.6.1.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${git_lfs_archive}" \
            https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz
          echo "2138d2e405a12f1a088272e06790b76699b79cb90d0317b77aafaf35de908d76  ${git_lfs_archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${git_lfs_archive}" --directory "${RUNNER_TEMP}"
          sudo install --mode=0755 "${RUNNER_TEMP}/git-lfs-3.6.1/git-lfs" /usr/local/bin/git-lfs
          git-lfs version
          bash scripts/verify-protocol-conformance.sh
          cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_protocol_frontends_e2e \
            -E 'test(native_git_lfs)'
          USE_BAZEL_VERSION=9.2.0 cargo nextest run --locked --manifest-path e2e/Cargo.toml \
            --test native_protocol_frontends_e2e \
            -E 'test(native_bazel)' --run-ignored all

      - name: Run S3 real-client e2e tests
        run: cargo nextest run --locked -p shardline-server --test s3_real_client_e2e

      - name: Qualify stock Git LFS locks across replicas and restart
        run: >-
          cargo nextest run --locked -p shardline-server --features docker
          --test protocol_completion --run-ignored all
          -E 'test(stock_git_lfs_locks_across)'

      - name: Run DuckDB against Postgres + MinIO deployment shape
        run: >-
          cargo nextest run --locked -p shardline-server --features docker
          --test postgres_s3_e2e_http
          -E 'test(duckdb_real_client_postgres_s3_deployment_shape)'
