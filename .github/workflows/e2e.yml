name: E2E Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Build shardline binary
        run: cargo build --release

      - name: Install real clients (mc, hf CLI, pyarrow, AWS CLI, boto3, s3cmd, rclone)
        run: |
          sudo curl -fsSLo /usr/local/bin/mc \
            https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-08-13T08-35-41Z
          sudo chmod +x /usr/local/bin/mc
          mc --version
          pip3 install --break-system-packages huggingface_hub pyarrow awscli boto3 s3cmd
          hf --version
          python3 -c "import pyarrow; print('pyarrow', pyarrow.__version__)"
          aws --version
          python3 -c "import boto3; print('boto3', boto3.__version__)"
          s3cmd --version
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone --version

      - name: Run e2e tests
        run: cargo make test-e2e

      - name: Run S3 real-client e2e tests
        run: cargo nextest run -p shardline-server --test s3_real_client_e2e --no-tests=pass
