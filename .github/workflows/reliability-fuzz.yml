name: Reliability fuzz

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Minimum libFuzzer wall-clock duration per target
        required: false
        default: "3600"
  pull_request:
    paths:
      - ".github/workflows/reliability-fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fuzz/**"
      - "crates/shardline-reliability/**"
      - "scripts/shardline/fuzz.sh"
      - "Makefile.toml"
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: reliability-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reliability-fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - shardline_reliability_lifecycle
          - shardline_reliability_lifecycle_log
          - shardline_reliability_resumable_evidence
          - shardline_resumable_state_digest
          - shardline_resumable_session_state
          - shardline_reliability_session_evidence
          - shardline_reliability_upload_evidence
          - shardline_reliability_provider_evidence
          - shardline_reliability_quarantine_evidence
          - shardline_reliability_retention_evidence
          - shardline_reliability_webhook_evidence
          - shardline_reliability_oci_evidence
          - shardline_reliability_metadata_evidence
          - shardline_reliability_oci_tag_evidence
          - shardline_reliability_s3_object_evidence
          - shardline_reliability_persisted_event
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SHARDLINE_FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds || (github.event_name == 'pull_request' && '300') || '3600' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Run reliability fuzz campaign
        run: bash scripts/shardline/fuzz.sh reliability ${{ matrix.target }}
