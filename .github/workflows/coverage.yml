name: Coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup coverage toolchain
        uses: ./.github/actions/rust-ci-setup
        with:
          rust-components: rustfmt,clippy,llvm-tools-preview
          cargo-tools: cargo-make,cargo-nextest,cargo-llvm-cov

      - name: Generate coverage and enforce ratchet
        run: cargo make coverage-check

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llvm-coverage-summary
          path: target/coverage.json
          if-no-files-found: ignore
