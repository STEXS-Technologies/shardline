name: PostgreSQL contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  distributed-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Install clock fault injector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfaketime
          faketime_library=$(dpkg -L libfaketime | awk '/libfaketime\.so\.1$/ { print; exit }')
          test -n "$faketime_library"
          echo "SHARDLINE_FAKETIME_LIBRARY=$faketime_library" >> "$GITHUB_ENV"

      - name: Verify distributed integrity and mixed-version operation
        run: cargo make test-distributed-integrity distributed-integrity-results

      - name: Upload distributed integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributed-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: distributed-integrity-results
          if-no-files-found: error
          retention-days: 30

  configured-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shardline
          POSTGRES_PASSWORD: shardline-dev-password
          POSTGRES_DB: shardline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shardline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://shardline:shardline-dev-password@localhost:5432/shardline
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Apply database schema
        run: cargo run --locked -p shardline -- db migrate up --database-url "$DATABASE_URL"

      - name: Run complete configured PostgreSQL contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p postgres-contract-results
          cargo make test-postgres 2>&1 | tee postgres-contract-results/tests.log

      - name: Upload configured PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-contract-results
          if-no-files-found: warn
          retention-days: 30

  owned-process-cuts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Verify released/current PostgreSQL process cuts
        run: cargo make test-postgres-process-cuts postgres-process-cut-results

      - name: Upload owned process-cut evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-process-cuts-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-process-cut-results
          if-no-files-found: error
          retention-days: 30
