name: Rust CI Setup
description: Install the Rust toolchain, cache cargo artifacts, and install CI cargo tools.

inputs:
  install-rust-toolchain:
    description: Whether to install the Rust toolchain in this action.
    required: false
    default: "true"
  rust-components:
    description: Comma-separated rustup components to install.
    required: false
    default: rustfmt,clippy
  cargo-tools:
    description: Comma-separated cargo-installable tools for CI.
    required: false
    default: cargo-make,cargo-nextest@0.9.123

runs:
  using: composite
  steps:
    - name: Install Linux build and verification tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang jq ripgrep

    - name: Install Rust toolchain
      if: ${{ inputs.install-rust-toolchain == 'true' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "shardline-shared-cache"

    - name: Install cargo tools
      if: ${{ inputs.cargo-tools != '' }}
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.cargo-tools }}
