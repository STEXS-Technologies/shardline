# Docker-backed integration binaries start disposable Postgres, Redis, and
# MinIO containers. Limit their concurrent startup to prevent resource
# exhaustion and transient connection EOFs on CI runners.

# PostgreSQL advisory locks are database-wide, even when fixtures have distinct
# schemas. Keep all library tests that can own or install the shared maintenance
# barrier in one group. Their own tasks/connections still run concurrently, so
# serialization between tests preserves the concurrency assertions within each.
[[profile.default.overrides]]
filter = 'kind(lib) and ((package(shardline-index) and test(postgres)) or (package(shardline-server) and test(/postgres|maintenance_barrier|database_migration|lifecycle_repair|task_tracking|upload_intent_recovery|retention_runtime|gc_runtime|rebuild|hub_secret_upgrade/)))'
test-group = "postgres-coordination"

[[profile.default.overrides]]
filter = 'binary(postgres_e2e_http)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(postgres_integration)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(postgres_redis_e2e_http)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(postgres_s3_e2e_http)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(redis_integration)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(s3_e2e_http)'
test-group = "docker-integration"

[[profile.default.overrides]]
filter = 'binary(s3_integration)'
test-group = "docker-integration"

# Each deployment drill creates an entire disposable Compose stack and injects
# backend outages. Match the dedicated distributed gate's inter-test admission;
# clients and replicas inside each drill still execute concurrently.
[[profile.default.overrides]]
filter = 'binary(deployment_chaos) or binary(multinode_chaos)'
test-group = "deployment-chaos"

[test-groups.deployment-chaos]
max-threads = 1

[test-groups.docker-integration]
max-threads = 4

[test-groups.postgres-coordination]
max-threads = 1
