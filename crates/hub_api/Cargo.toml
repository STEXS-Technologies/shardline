[package]
name = "shardline-hub-api"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shardline-hub-api"
readme = "../../README.md"
description = "HuggingFace Hub API compatibility layer for Shardline."

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
flate2.workspace = true
hmac.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
shardline-index.workspace = true
shardline-metrics.workspace = true
shardline-protocol.workspace = true
shardline-server-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
http-body-util = "0.1"
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
