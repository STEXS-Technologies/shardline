[package]
name = "sdx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sdx"
description = "Native Xet client library for Shardline's Xet frontend."
readme = "README.md"
keywords = ["xet", "cas", "deduplication", "shardline", "client"]
categories = [
    "development-tools",
    "filesystem",
    "network-programming",
]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
# Detect corruption in persisted chunk-cache entries.
crc32fast = "1.5"
futures-util.workspace = true
shardline-xet-core.workspace = true
httpdate.workspace = true
# Stream upload bodies with an exact Content-Length.
http-body = "1"
percent-encoding = "2.3"
tracing.workspace = true
# Shared Xet wire types and routes; currently also pulls in server-core.
shardline-xet-adapter.workspace = true
thiserror.workspace = true
# Cancellation tokens and abort-on-drop task handles for streaming.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Upstream publishes without semver promises: keep hash/xorb primitives pinned.
xet-core-structures = { version = "=1.5.2" }
# Its upstream runtime dependency is a caret requirement despite incompatible
# API changes in newer releases. Constrain it for consumers without our lockfile.
xet-runtime.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
shardline-storage.workspace = true

[target.'cfg(not(unix))'.dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
shardline-storage = { workspace = true, features = ["test-fault-injection"] }

[dev-dependencies]
axum.workspace = true
shardline-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
wiremock = "0.6"

[lints]
workspace = true
