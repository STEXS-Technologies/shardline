[package]
name = "shardline-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shardline-cache"
readme = "README.md"
description = "Reconstruction-cache contracts and adapters for Shardline."

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
hex.workspace = true
getrandom.workspace = true
redis = { workspace = true, features = ["tokio-rustls-comp"] }
rustls.workspace = true
shardline-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
shardline-test-support = { workspace = true, features = ["docker"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[[bench]]
name = "reconstruction_cache"
harness = false

[lints]
workspace = true
