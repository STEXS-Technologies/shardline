[package]
name = "shardline-s3-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shardline-s3-adapter"
description = "S3-compatible protocol adapter for the Shardline server ecosystem."

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
crc-fast = "1.10"
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
percent-encoding = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
subtle.workspace = true
shardline-index.workspace = true
shardline-protocol.workspace = true
shardline-reliability.workspace = true
shardline-server-core.workspace = true
shardline-storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }

[lints]
workspace = true
