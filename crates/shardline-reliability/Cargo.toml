[package]
name = "shardline-reliability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Durable lifecycle identities and compatibility boundaries for Shardline."

[features]
default = []
task-journal = ["dep:penelope-core", "dep:rusqlite", "dep:hex"]
process-runtime = ["task-journal", "dep:rustix", "dep:libc", "dep:hex"]

[dependencies]
chrono.workspace = true
ed25519-dalek.workspace = true
penelope.workspace = true
# Released public type identities; execution and canonicalization use 0.2.
penelope-domain-compat = { package = "penelope-domain", version = "0.1.0" }
statechronicle-core-compat = { package = "statechronicle-core", version = "0.1.0" }
statechronicle-domain-compat = { package = "statechronicle-domain", version = "0.1.0" }
# Enable serde for task types; the 0.2 umbrella has no feature passthrough.
# All protocol imports use the umbrella re-exports.
penelope-core = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
statechronicle.workspace = true
statechronicle-ed25519.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
statechronicle-commit-compat = { package = "statechronicle-commit", version = "0.1.0" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "process_test_worker"
required-features = ["process-runtime"]
