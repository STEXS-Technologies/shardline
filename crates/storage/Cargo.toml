[package]
name = "shardline-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shardline-storage"
readme = "../../README.md"
description = "Content-addressed object storage contracts and adapters for Shardline."

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["s3"]
s3 = ["object_store/aws"]

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
futures-util.workspace = true
libc.workspace = true
object_store = { workspace = true, default-features = false }
shardline-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
chrono.workspace = true
hex.workspace = true
proptest.workspace = true
shardline-test-support = { workspace = true, features = ["docker"] }
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "s3_integration"
required-features = ["s3"]

[[bench]]
name = "s3_put_file_fixed"
required-features = ["s3"]
harness = false
