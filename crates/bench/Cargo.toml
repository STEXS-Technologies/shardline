[package]
name = "shardline-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Benchmarks and load testing for the Shardline server ecosystem."
publish = false

[[bench]]
name = "reconstruction"
harness = false

[[bench]]
name = "s3_io"
harness = false

[[bin]]
name = "load_test"
path = "src/load_test.rs"

[dependencies]
bytes.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde_json.workspace = true
shardline-index.workspace = true
shardline-protocol.workspace = true
shardline-server-core.workspace = true
shardline-storage = { workspace = true, features = ["s3"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
blake3.workspace = true
hex.workspace = true
sha2.workspace = true
shardline-cache.workspace = true
shardline-server.workspace = true
shardline-xet-adapter.workspace = true
shardline-xet-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "local_backend"
harness = false

[[bench]]
name = "oci_tags"
harness = false

[[bench]]
name = "oci_tags_fixed"
harness = false

[[bench]]
name = "oci_finalize_fixed"
harness = false

[[bench]]
name = "protocol_core"
harness = false

[[bench]]
name = "auth_verify"
harness = false

[[bench]]
name = "reconstruction_cache"
harness = false

[[bench]]
name = "xorb_validate"
harness = false
