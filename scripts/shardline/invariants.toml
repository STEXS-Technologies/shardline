# Focused coverage ledger for the storage/recovery paths changed by maintenance cleanup.
# This is an index of retained checks, not a test runner or a complete product safety map.
# Before removing a test, compare its inputs, injected failure and assertions with
# its replacement. A matching invariant ID alone does not establish redundancy.
# Listed tests remain required by their existing CI/release gates. Docker-backed
# qualification must set SHARDLINE_REQUIRE_NATIVE_CLIENTS=1; optional skips are not evidence.
version = 1

[[invariant]]
id = "I-BYTES"
guarantee = "Reject object bytes whose expected length or storage digest does not match."
owners = ["crates/shardline-storage/src/object.rs", "crates/shardline-storage/src/local/util.rs", "crates/shardline-storage/src/s3/operations.rs"]
failure_boundaries = ["length mismatch", "hash mismatch", "empty object", "existing immutable object"]
tests = [
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_verify_integrity_accepts_matching", backend = "local" },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_verify_integrity_rejects_length_mismatch", backend = "local" },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_verify_integrity_rejects_hash_mismatch", backend = "local" },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_existing_object_outcome_integrity_contract", backend = "local" },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "verify_integrity_accepts_matching_hash_and_length", backend = "s3-helper" },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "verify_integrity_rejects_length_mismatch", backend = "s3-helper" },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "verify_integrity_rejects_hash_mismatch", backend = "s3-helper" },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "verify_integrity_rejects_empty_bytes_with_nonzero_length", backend = "s3-helper" },
]

[[invariant]]
id = "I-LOCAL-PATH"
guarantee = "Object reads, writes and deletion must not escape the object root through symlinks or parent replacement."
owners = ["crates/shardline-storage/src/local_fs.rs", "crates/shardline-storage/src/local_path.rs"]
failure_boundaries = ["symlinked parent", "parent swap during conditional write", "parent swap during overwrite", "stray committed file"]
tests = [
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_object_store_rejects_symlinked_parent_directory_reads", backend = "local-unix", prerequisites = ["Unix"] },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_object_store_rejects_symlinked_parent_directory_writes", backend = "local-unix", prerequisites = ["Unix"] },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_object_store_rejects_symlinked_parent_directory_deletes", backend = "local-unix", prerequisites = ["Unix"] },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "local_object_store_writes_reject_parent_swap_race", backend = "local-unix", prerequisites = ["Unix"] },
]

[[invariant]]
id = "I-DURABILITY"
guarantee = "A duplicate publication must satisfy directory durability; an uncertain remote deletion must propagate failure without an invented retry outcome."
owners = ["crates/shardline-storage/src/local/io.rs", "crates/shardline-storage/src/s3/operations.rs"]
failure_boundaries = ["parent sync failure after interrupted install", "asynchronous sync failure", "dropped DELETE reply", "retryable DELETE response"]
tests = [
  { file = "crates/shardline-storage/src/local/tests.rs", name = "duplicate_publication_requires_parent_durability_after_interrupted_install", backend = "local-unix", prerequisites = ["Unix"] },
  { file = "crates/shardline-storage/src/local/tests.rs", name = "async_duplicate_publication_propagates_parent_sync_failure", backend = "local-unix", prerequisites = ["Unix"] },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "single_attempt_delete_does_not_retry_dropped_reply_or_retryable_server_error", backend = "s3-http-fixture" },
]

[[invariant]]
id = "I-GC-TEMP"
guarantee = "Generated temporary-object names must not shadow or sweep legal user object keys."
owners = ["crates/shardline-storage/src/temporary_name.rs", "crates/shardline-storage/src/s3/types.rs", "crates/shardline-storage/src/s3/operations.rs"]
failure_boundaries = ["legacy temp-shaped user names", "listing", "flat namespace listing", "stale-temp sweep"]
tests = [
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "temporary_key_detection_never_shadows_user_objects", backend = "s3-helper" },
  { file = "crates/shardline-storage/src/s3/tests.rs", name = "minio_collision_shaped_user_keys_are_listed_and_never_swept", backend = "minio", prerequisites = ["Docker", "SHARDLINE_REQUIRE_NATIVE_CLIENTS=1"] },
]

[[invariant]]
id = "I-RECOVERY-QUERY"
guarantee = "Only the recognized missing upload-intents table may skip reconciliation; genuine database and storage failures propagate."
owners = ["crates/shardline-server/src/upload_intent_recovery/reconcile.rs"]
failure_boundaries = ["missing intents table", "malformed intents schema", "missing evidence table", "SQLite busy", "permission denied", "closed PostgreSQL pool"]
tests = [
  { file = "crates/shardline-server/src/upload_intent_recovery/reconcile/tests.rs", name = "sqlite_recovery_skips_only_the_missing_intents_table", backend = "sqlite" },
  { file = "crates/shardline-server/src/upload_intent_recovery/reconcile/tests.rs", name = "sqlite_legacy_detection_rejects_storage_failures_and_other_tables", backend = "sqlite" },
  { file = "crates/shardline-server/src/upload_intent_recovery/reconcile/tests.rs", name = "postgres_recovery_distinguishes_missing_table_from_database_failure", backend = "postgres", prerequisites = ["server feature docker", "Docker", "SHARDLINE_REQUIRE_NATIVE_CLIENTS=1"] },
]

[[invariant]]
id = "I-LIFECYCLE-EVIDENCE"
guarantee = "Corrupt lifecycle evidence must reject mutation and leave the stored metadata intact."
owners = ["crates/shardline-index/src/memory.rs"]
failure_boundaries = ["quarantine release", "quarantine replacement", "retention release", "conditional release"]
tests = [
  { file = "crates/shardline-index/src/memory.rs", name = "memory_delete_quarantine_candidate_preserves_tampered_state", backend = "memory" },
  { file = "crates/shardline-index/src/memory.rs", name = "memory_upsert_quarantine_candidate_preserves_tampered_evidence", backend = "memory" },
  { file = "crates/shardline-index/src/memory.rs", name = "memory_retention_hold_read_rejects_tampered_evidence", backend = "memory" },
]

[[invariant]]
id = "I-OBJECT-INVENTORY"
guarantee = "Object enumeration preserves prefix filtering, empty results and page limits across metadata adapters."
owners = ["crates/shardline-server/src/backend.rs", "crates/shardline-server/src/object_store.rs"]
failure_boundaries = ["empty store", "no matching prefix", "nested matching keys", "bounded page", "local blocking dispatch", "direct PostgreSQL dispatch"]
# These adapter tests use local object fixtures. They do not qualify remote SQL or S3 behavior.
tests = [
  { file = "crates/shardline-server/src/local_backend/objects.rs", name = "visit_object_prefix_returns_ok_with_empty_store", backend = "local" },
  { file = "crates/shardline-server/src/local_backend/objects.rs", name = "visit_object_prefix_lists_stored_objects", backend = "local" },
  { file = "crates/shardline-server/src/local_backend/objects.rs", name = "list_object_flat_namespace_page_returns_paginated_results", backend = "local" },
  { file = "crates/shardline-server/src/postgres_backend/read.rs", name = "visit_object_prefix_returns_matching_objects", backend = "postgres-adapter/local-objects" },
  { file = "crates/shardline-server/src/postgres_backend/read.rs", name = "visit_object_prefix_empty_when_no_match", backend = "postgres-adapter/local-objects" },
  { file = "crates/shardline-server/src/postgres_backend/read.rs", name = "visit_object_prefix_empty_store", backend = "postgres-adapter/local-objects" },
  { file = "crates/shardline-server/src/postgres_backend/read.rs", name = "list_object_flat_namespace_page_returns_at_most_limit", backend = "postgres-adapter/local-objects" },
  { file = "crates/shardline-server/src/postgres_backend/read.rs", name = "list_object_flat_namespace_page_with_limit", backend = "postgres-adapter/local-objects" },
]

[[invariant]]
id = "I-SNAPSHOT-HISTORY"
guarantee = "Verify snapshot history and its current materialized state without changing released evidence encodings."
owners = ["crates/shardline-reliability/src/snapshot_event.rs", "crates/shardline-reliability/src/snapshot_log.rs", "crates/shardline-reliability/src/operation.rs"]
failure_boundaries = ["sequence gap", "sequence overflow", "current state mismatch", "tampered commitment", "rewritten storage sequence", "released encoding compatibility", "operation ID field boundaries"]
tests = [
  { file = "crates/shardline-reliability/src/tests.rs", name = "operation_ids_preserve_byte_lengths_and_field_boundaries", backend = "typed-evidence" },
  { file = "crates/shardline-reliability/src/tests.rs", name = "snapshot_chain_rejects_sequence_gaps", backend = "typed-evidence" },
  { file = "crates/shardline-reliability/src/tests.rs", name = "snapshot_evidence_rejects_sequence_overflow", backend = "typed-evidence" },
  { file = "crates/shardline-reliability/src/tests.rs", name = "snapshot_evidence_helpers_share_baseline_repair_and_append_policy", backend = "typed-evidence" },
  { file = "crates/shardline-reliability/src/tests.rs", name = "snapshot_transition_helper_verifies_before_and_appends_after", backend = "typed-evidence" },
  { file = "crates/shardline-reliability/tests/deployment_compatibility.rs", name = "historical_deployment_evidence_preserves_commitments_and_signatures", backend = "released-fixtures" },
  { file = "crates/shardline-reliability/tests/deployment_compatibility.rs", name = "historical_evidence_rejects_tampering_and_storage_sequence_rewrites", backend = "released-fixtures" },
]

[[invariant]]
id = "I-SNAPSHOT-REACTIVATION"
guarantee = "Use the verified released snapshot as the reactivation boundary when a retention hold or quarantine observation changes."
owners = ["crates/shardline-reliability/src/snapshot_log.rs", "crates/shardline-reliability/src/retention_evidence.rs", "crates/shardline-reliability/src/quarantine_evidence.rs"]
failure_boundaries = ["changed retention reason and timestamps", "changed quarantine length and timestamps", "repeated release", "tampered snapshot"]
tests = [
  { file = "crates/shardline-reliability/src/retention_evidence.rs", name = "reactivation_uses_the_released_snapshot_as_transition_boundary", backend = "retention-evidence" },
  { file = "crates/shardline-reliability/src/quarantine_evidence.rs", name = "reactivation_uses_the_released_snapshot_as_transition_boundary", backend = "quarantine-evidence" },
  { file = "crates/shardline-reliability/src/quarantine_evidence.rs", name = "released_candidate_cannot_be_released_twice", backend = "quarantine-evidence" },
  { file = "crates/shardline-reliability/src/quarantine_evidence.rs", name = "state_digest_tampering_is_rejected", backend = "quarantine-evidence" },
]

[[invariant]]
id = "I-MULTIPART-JOURNAL"
guarantee = "Multipart recovery trusts committed evidence and Merkle heads, rejects tampering, and ignores or trims uncommitted crash tails."
owners = ["crates/shardline-s3-adapter/src/multipart.rs"]
failure_boundaries = ["tampered Merkle journal", "tampered durable head", "missing committed journal", "metadata crash after evidence append", "metadata crash after Merkle append"]
# Filesystem fixtures qualify the adapter journal policy, not remote publication durability.
tests = [
  { file = "crates/shardline-s3-adapter/src/multipart.rs", name = "tampered_merkle_journal_is_rejected", backend = "local-journal" },
  { file = "crates/shardline-s3-adapter/src/multipart.rs", name = "bounded_session_read_rejects_tampered_durable_head", backend = "local-journal" },
  { file = "crates/shardline-s3-adapter/src/multipart.rs", name = "bounded_session_read_rejects_missing_committed_journal", backend = "local-journal" },
  { file = "crates/shardline-s3-adapter/src/multipart.rs", name = "uncommitted_evidence_journal_tail_is_ignored_after_metadata_crash", backend = "local-journal" },
  { file = "crates/shardline-s3-adapter/src/multipart.rs", name = "uncommitted_merkle_journal_tail_is_trimmed_after_metadata_crash", backend = "local-journal" },
]

[[invariant]]
id = "I-TASK-HISTORY"
guarantee = "Paginated task inspection and oldest-first retention preserve unfinished or unreadable evidence and user payloads; deleted cursors must not reset pagination."
owners = ["crates/shardline-server/src/task_tracking/status.rs", "crates/shardline-server/src/task_tracking/retention.rs"]
failure_boundaries = ["multiple inspection pages", "multiple 64-run retention batches", "deleted cursor", "unfinished history", "unreadable manifest", "invalid key beyond the requested page", "conflicting legacy identity"]
# Keep both automatic backlog sizes: the larger fixture checks scale across
# more retention batches. The ignored capacity drill supplements these checks;
# its script is an explicit qualification command, not an automatic CI gate.
tests = [
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "metadata_backlog_paginates_and_drains_without_removing_unfinished_or_corrupt_history", backend = "sqlite" },
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "larger_metadata_backlog_preserves_pagination_and_safe_retention", backend = "sqlite" },
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "metadata_retention_uses_creation_time_instead_of_key_order", backend = "sqlite" },
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "unfinished_history_does_not_starve_finished_history_retention", backend = "sqlite" },
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "batched_local_retention_preserves_conflicting_legacy_identity", backend = "sqlite" },
  { file = "crates/shardline-server/src/task_tracking/tests.rs", name = "full_automatic_metadata_capacity_preserves_inspection_and_cleanup", backend = "sqlite-scale", prerequisites = ["explicit ignored test in release mode", "scripts/shardline/verify_maintenance_history_capacity.sh"] },
]

[[invariant]]
id = "I-REBUILD"
guarantee = "Rebuild selects repository-specific latest versions deterministically. Incomplete version inventories preserve heads and reconstructions; invalid shard inventories preserve existing dedupe mappings."
owners = ["crates/shardline-rebuild/src/candidates.rs", "crates/shardline-rebuild/src/runner.rs"]
failure_boundaries = ["repository and revision identity", "timestamp and hash ordering", "unreadable newest version", "missing latest row during incomplete scan", "dirty reconstruction inventory", "invalid retained shard"]
# These local SQLite and memory fixtures cover rebuild policy. They do not
# qualify PostgreSQL transactions, remote durability or maintenance ownership.
tests = [
  { file = "crates/shardline-rebuild/src/candidates.rs", name = "candidate_grouping_preserves_repository_identity_revision_and_file_id", backend = "sqlite" },
  { file = "crates/shardline-rebuild/src/candidates.rs", name = "collect_candidate_selects_latest_epoch_then_content_hash", backend = "sqlite" },
  { file = "crates/shardline-rebuild/src/candidates.rs", name = "candidate_ordering_uses_epoch_then_hash_then_locator", backend = "pure-policy" },
  { file = "crates/shardline-rebuild/src/tests.rs", name = "run_index_rebuild_keeps_latest_record_when_version_record_unreadable", backend = "sqlite/memory-index" },
  { file = "crates/shardline-rebuild/src/tests.rs", name = "rebuild_does_not_roll_back_latest_when_newest_version_is_corrupt", backend = "sqlite/memory-index" },
  { file = "crates/shardline-rebuild/src/tests.rs", name = "prune_stale_reconstructions_returns_early_when_report_is_dirty", backend = "memory-index" },
  { file = "crates/shardline-rebuild/src/tests.rs", name = "rebuild_dedupe_shard_mappings_preserves_existing_mappings_after_invalid_shard_scan", backend = "local-objects/memory-index" },
]
