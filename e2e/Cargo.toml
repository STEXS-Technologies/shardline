[package]
name = "shardline-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[test]]
name = "protocol_frontends_http"
path = "protocol_frontends_http.rs"

[[test]]
name = "transfer_http"
path = "transfer_http.rs"

[[test]]
name = "role_split_e2e"
path = "role_split_e2e.rs"

[[test]]
name = "git_xet_push_e2e"
path = "git_xet_push_e2e.rs"

[[test]]
name = "native_protocol_frontends_e2e"
path = "native_protocol_frontends_e2e.rs"

[[test]]
name = "native_xet_client_e2e"
path = "native_xet_client_e2e.rs"

[[test]]
name = "live_provider_bridge_e2e"
path = "live_provider_bridge_e2e.rs"

[[test]]
name = "provider_http_tests"
path = "provider_http_tests.rs"

[[test]]
name = "provider_token_flow"
path = "provider_token_flow.rs"

[[test]]
name = "k8s_cluster_protocol_e2e"
path = "k8s_cluster_protocol_e2e.rs"

[[test]]
name = "data_integrity"
path = "data_integrity.rs"

[dependencies]
shardline-server = { path = "../crates/server" }
shardline-server-core = { path = "../crates/server_core" }
shardline-protocol = { path = "../crates/protocol" }
shardline-index = { path = "../crates/index" }
shardline-storage = { path = "../crates/storage" }
shardline-test-support = { path = "../crates/test_support", features = ["docker"] }
shardline-vcs = { path = "../crates/vcs" }
shardline-xet-core = { path = "../crates/xet_core" }
blake3 = "1.8.3"
redis = "1.0.2"
sqlx = { version = "0.8.6", default-features = false }
xet-client = "1.5.1"
xet-data = "1.5.1"
xet-runtime = "1.5.1"
url = "2.5"
axum = "0.8.8"
base64 = "0.22"
bytes = "1.10.1"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["compress"] }
tokio = { version = "1.48.0", features = ["full"] }
tempfile = "3.15"
tracing = "0.1"
futures-util = "0.3"
async-trait = "0.1"
