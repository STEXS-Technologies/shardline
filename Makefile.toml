[tasks.build]
description = "Build all shardline workspace crates"
workspace = false
command = "cargo"
args = ["build", "--workspace", "--all-features", "${@}"]
dependencies = ["clean"]

[tasks.format-rust]
description = "Format Rust code using rustfmt"
workspace = false
command = "cargo"
args = ["fmt", "--all"]

[tasks.format-docs]
description = "Format Markdown docs using flowmark"
workspace = false
install_crate = "flowmark"
install_crate_args = ["--locked"]
command = "flowmark"
args = ["-i", "--nobackup", "-s", "-c", "docs", "README.md", "docs"]

[tasks.format]
description = "Format Rust code and Markdown docs"
workspace = false
dependencies = ["format-rust", "format-docs"]

[tasks.format-check]
description = "Verify code formatting with rustfmt"
workspace = false
command = "cargo"
args = ["fmt", "--check", "--all"]

[tasks.clean]
description = "Remove build artifacts"
workspace = false
command = "cargo"
args = ["clean", "${@}"]

[tasks.bacon]
description = "Live code checking with bacon"
workspace = false
install_crate = "bacon"
command = "bacon"
args = ["${@}", "check-all"]

[tasks.audit]
description = "Security audit for dependencies"
workspace = false
command = "cargo"
args = ["audit", "${@}"]

[tasks.build-prod]
description = "Build optimized release binaries"
workspace = false
command = "cargo"
args = ["build", "--workspace", "--release", "--all-features", "${@}"]
dependencies = ["clean"]

[tasks.check]
description = "Quick compilation check without building"
workspace = false
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features", "${@}"]

[tasks.test]
description = "Run workspace lib tests (fast, no external infrastructure needed)"
workspace = false
command = "cargo"
args = ["test", "--workspace", "--lib", "${@}"]

[tasks.test-integration]
description = "Run integration tests (requires Docker: Postgres, MinIO, Redis)"
workspace = false
install_crate = "cargo-nextest@0.9.123"
install_crate_args = ["--locked"]
command = "cargo"
args = ["nextest", "run", "--workspace", "--all-features", "--no-tests=pass", "-E", "not package(shardline-xet-core)", "-E", "kind(test)", "${@}"]

[tasks.test-postgres]
description = "Run Postgres-gated tests (requires DATABASE_URL env var)"
workspace = false
command = "bash"
args = ["-c", "cargo test -p shardline-index -- hub_postgres && cargo test -p shardline-server -- postgres_backend::tests database_migration lifecycle_repair::tests && cargo test -p shardline-cli --test db_migrate_e2e"]

[tasks.test-e2e]
description = "Run e2e integration tests from the e2e/ folder"
workspace = false
install_crate = "cargo-nextest@0.9.123"
install_crate_args = ["--locked"]
command = "cargo"
args = ["nextest", "run", "--all-features", "--no-tests=pass", "${@}"]
cwd = "e2e"

[tasks.test-docker]
description = "Run Docker-backed server integration and end-to-end tests"
workspace = false
install_crate = "cargo-nextest@0.9.123"
install_crate_args = ["--locked"]
command = "bash"
args = ["-c", "docker version >/dev/null && cargo nextest run -p shardline-server --features docker --no-tests=pass && (cd e2e && cargo nextest run --all-features --no-tests=pass)"]

[tasks.test-kubernetes]
description = "Run the disposable kind deployment smoke test"
workspace = false
command = "bash"
args = ["scripts/k8s/kind-smoke.sh"]

[tasks.test-infrastructure]
description = "Run Docker-backed tests followed by the disposable Kubernetes smoke test"
workspace = false
command = "bash"
args = ["-c", "cargo make test-docker && cargo make test-kubernetes"]

[tasks.verify-release-binary]
description = "Build the release shardline binary and smoke-test the packaged entrypoint"
workspace = false
command = "bash"
args = ["scripts/verify-release-binary.sh"]

[tasks.clippy]
description = "Run clippy with strict rules on the shardline workspace"
workspace = false
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--exclude", "shardline-xet-core", "--", "-D", "warnings", "${@}"]

[tasks.udeps]
description = "Find unused dependencies (requires nightly)"
workspace = false
install_crate = "cargo-udeps"
command = "cargo"
args = ["+nightly", "udeps"]

[tasks.bloat]
description = "Analyze binary size and bloat"
workspace = false
install_crate = "cargo-bloat"
command = "cargo"
args = ["bloat", "--release", "${@}"]

[tasks.expand]
description = "Expand macros to see generated code"
workspace = false
install_crate = "cargo-expand"
command = "cargo"
args = ["expand", "${@}"]

[tasks.shardline-bench-protocol]
description = "Run shardline protocol microbenchmarks"
workspace = false
command = "cargo"
args = ["bench", "-p", "shardline-protocol", "--bench", "protocol_core", "--", "--noplot", "${@}"]

[tasks.shardline-bench-local-backend]
description = "Run shardline local-backend microbenchmarks"
workspace = false
command = "cargo"
args = ["bench", "-p", "shardline-server", "--bench", "local_backend", "--", "--noplot", "${@}"]

[tasks.shardline-bench-e2e]
description = "Run the shardline deterministic end-to-end benchmark suite"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "e2e", "${@}"]

[tasks.shardline-bench-ingest]
description = "Run the shardline zero-storage ingest benchmark suite"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "e2e", "--mode", "ingest", "${@}"]

[tasks.shardline-perf-e2e]
description = "Record a perf profile for the optimized shardline end-to-end benchmark suite"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "${@}"]

[tasks.shardline-perf-ingest]
description = "Record a perf profile for the optimized shardline zero-storage ingest benchmark suite"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "--mode", "ingest", "${@}"]

[tasks.shardline-perf-upload]
description = "Record a perf profile for the shardline initial upload hot path"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "--scenario", "initial-upload", "${@}"]

[tasks.shardline-perf-reconstruction]
description = "Record a perf profile for the shardline latest reconstruction hot path"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "--scenario", "latest-download", "${@}"]

[tasks.shardline-perf-range]
description = "Record a perf profile for the shardline ranged reconstruction planning hot path"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "--scenario", "ranged-reconstruction", "${@}"]

[tasks.shardline-perf-dedupe]
description = "Record a perf profile for the shardline cross-repository dedupe upload hot path"
workspace = false
command = "bash"
args = ["scripts/shardline/perf.sh", "perf-e2e", "--scenario", "cross-repository-upload", "${@}"]

[tasks.shardline-fuzz-list]
description = "List shardline fuzz targets"
workspace = false
command = "bash"
args = ["scripts/shardline/fuzz.sh", "list"]

[tasks.shardline-fuzz]
description = "Run a shardline fuzz target from the repository root"
workspace = false
command = "bash"
args = ["scripts/shardline/fuzz.sh", "run", "${@}"]

[tasks.shardline-fuzz-smoke]
description = "Run bounded shardline fuzz passes across every shardline target"
workspace = false
command = "bash"
args = ["scripts/shardline/fuzz.sh", "smoke", "${@}"]

[tasks.shardline-fuzz-regression]
description = "Replay each checked-in Shardline fuzz corpus"
workspace = false
command = "bash"
args = ["scripts/shardline/fuzz.sh", "regression", "${@}"]

[tasks.deny]
description = "Check licenses and security advisories"
workspace = false
install_crate = "cargo-deny"
command = "cargo"
args = ["deny", "check"]

[tasks.check-dependency-exceptions]
description = "Fail CI when a dependency-security exception lacks ownership or has expired"
workspace = false
command = "bash"
args = ["scripts/check_dependency_exceptions.sh"]

[tasks.coverage]
description = "Print LLVM source-based workspace coverage summary"
workspace = false
install_crate = "cargo-llvm-cov"
install_crate_args = ["--locked"]
command = "cargo"
args = ["llvm-cov", "--workspace", "--all-features", "--exclude", "shardline-fuzz", "--summary-only", "${@}"]

[tasks.coverage-html]
description = "Generate an LLVM source-based HTML coverage report"
workspace = false
install_crate = "cargo-llvm-cov"
install_crate_args = ["--locked"]
command = "cargo"
args = ["llvm-cov", "--workspace", "--all-features", "--exclude", "shardline-fuzz", "--html", "${@}"]

[tasks.coverage-json]
description = "Write workspace and database-gated LLVM coverage to target/coverage.json"
workspace = false
install_crate = "cargo-llvm-cov"
install_crate_args = ["--locked"]
command = "bash"
args = ["scripts/run_coverage_json.sh", "${@}"]

[tasks.coverage-check]
description = "Generate coverage and enforce the checked-in line-coverage ratchet"
workspace = false
dependencies = ["coverage-json"]
command = "bash"
args = ["scripts/check_coverage_ratchet.sh"]

[tasks.ci]
description = "Run the core contributor CI checks"
workspace = false
dependencies = ["format-check", "clippy", "check-dependency-exceptions", "deny", "test", "verify-release-binary", "check-migration-sync"]

[tasks.ci-full]
description = "Run contributor CI plus dependency policy checks"
workspace = false
dependencies = ["ci"]

[tasks.ci-hardening]
description = "Run full CI plus hardening checks (overflow detection, MIRI, ASan, loom)"
workspace = false
dependencies = ["ci-full", "test-overflow", "test-miri", "test-asan", "test-loom"]

[tasks.test-loom]
description = "Run Loom concurrency model-checking tests"
workspace = false
command = "bash"
args = ["-c", "RUSTFLAGS='--cfg loom' cargo test -p shardline-loom-tests"]

[tasks.test-overflow]
description = "Run tests with integer overflow detection enabled"
workspace = false
command = "cargo"
args = ["test", "--workspace", "--all-features", "--exclude", "shardline-fuzz", "--lib"]
env = { RUSTFLAGS = "-C overflow-checks=on" }

[tasks.test-miri]
description = "Run MIRI on crates with unsafe code to detect undefined behavior"
workspace = false
install_crate = "cargo-miri"
command = "bash"
args = ["-c", "echo 'MIRI: checking config/secrets.rs unsafe blocks...' && cargo +nightly miri test -p shardline-server --lib -- config::secrets 2>&1 || { if [ \"${CI:-}\" = \"true\" ]; then exit 1; else echo 'MIRI skipped (requires nightly + specific target)'; fi; }"]

[tasks.test-asan]
description = "Run tests with AddressSanitizer to detect memory errors"
workspace = false
command = "bash"
args = ["-c", "echo 'ASan: checking server-core validation...' && RUSTFLAGS='-Zsanitizer=address' cargo +nightly test -p shardline-server-core --lib -Zbuild-std --target x86_64-unknown-linux-gnu -- validation 2>&1 || { if [ \"${CI:-}\" = \"true\" ]; then exit 1; else echo 'ASan skipped (requires nightly + build-std + target)'; fi; }"]

[tasks.check-migration-sync]
description = "Verify Postgres and SQLite migration versions are in sync"
workspace = false
command = "bash"
args = ["scripts/check_migration_sync.sh"]

[tasks.sqlx]
description = "Run raw SQLx CLI commands"
workspace = false
install_crate = "sqlx-cli"
command = "sqlx"
args = ["${@}"]
