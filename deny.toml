[graph]
all-features = true

[advisories]
ignore = [
    # parquet/arrow currently depend on paste for generated code; no safe
    # upgrade is available upstream. Re-check when parquet removes it.
    # Owner: shardline. Expiry: 2026-10-25.
    { id = "RUSTSEC-2024-0436", reason = "parquet 57 transitively uses paste; no safe upgrade is available. Re-check on parquet upgrade. Owner: shardline. Expiry: 2026-10-25." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary upstream HTTP/1 shutdown fix, pinned in Cargo.toml and Cargo.lock.
# https://github.com/hyperium/hyper/pull/4222
# Remove with the workspace patch once a fixed registry release is available.
# Crate publication remains blocked by scripts/check-publish-dependencies.py.
allow-git = ["https://github.com/hyperium/hyper"]
