[graph]
all-features = true

[advisories]
ignore = [
    # rationale: quick-xml DoS via quadratic attribute check / unbounded namespace allocation.
    # object_store only parses XML from the configured S3 endpoint (trusted operator input),
    # not attacker-controlled data. Upgrade blocked on object_store releasing with quick-xml >= 0.41.
    # Re-check when object_store bumps its quick-xml dependency past 0.40.
    # Owner: shardline. Expiry: 2026-10-25.
    { id = "RUSTSEC-2026-0194", reason = "object_store parses XML from S3 endpoint, not attacker-controlled input. Upgrade blocked on object_store releasing with quick-xml >= 0.41." },
    # rationale: same quick-xml DoS as RUSTSEC-2026-0194 — only parses XML from the trusted,
    # operator-configured S3 endpoint, never attacker-controlled input.
    # Owner: shardline. Expiry: 2026-10-25.
    { id = "RUSTSEC-2026-0195", reason = "object_store parses XML from S3 endpoint, not attacker-controlled input. Upgrade blocked on object_store releasing with quick-xml >= 0.41." },
    # parquet/arrow currently depend on paste for generated code; no safe
    # upgrade is available upstream. Re-check when parquet removes it.
    # Owner: shardline. Expiry: 2026-10-25.
    { id = "RUSTSEC-2024-0436", reason = "parquet 57 transitively uses paste; no safe upgrade is available. Re-check on parquet upgrade. Owner: shardline. Expiry: 2026-10-25." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
