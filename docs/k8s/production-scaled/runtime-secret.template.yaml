# These values can also be provided as SHARDLINE_* env vars
apiVersion: v1
kind: Secret
metadata:
  name: shardline-runtime
type: Opaque
stringData:
  index-postgres-url: postgres://shardline:replace-me@postgres.example.com:5432/shardline
  reconstruction-cache-url: redis://default:replace-me@garnet.example.com:6379
  s3-access-key-id: replace-me
  s3-secret-access-key: replace-me
  token-signing-key: replace-me
  metrics-token: replace-me
  admin-read-token: replace-me
  provider-api-key: replace-me
  # 32-byte AES-256 at-rest encryption key for provider-config webhook secrets
  # (SHARDLINE_CONFIG_SECRET_KEY). Generate one with, e.g.:
  #   openssl rand -base64 24
  # (24 random bytes base64-encode to exactly 32 characters; the trailing
  # newline the command prints is stripped on load.)
  config-secret-key: replace-me
